name: Build macOS PKG Installer

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (z.B. v1.0.8)"
        required: true

jobs:
  build-pkg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build macOS installers
        run: npm run build:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate built .app
        id: app
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/ZenPost Studio.app"
          if [ ! -d "$APP" ]; then
            APP="src-tauri/target/release/bundle/macos/ZenPost Studio.app"
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Gefunden: $APP"

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 \
            | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Locate .pkg installer
        run: |
          PKG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/*.pkg 2>/dev/null | head -1)
          echo "PKG_NAME=$(basename "$PKG")" >> "$GITHUB_ENV"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenpost-studio-macos-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/*.pkg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload .pkg to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "$PKG_PATH" --clobber
          echo "Hochgeladen: $PKG_NAME → Release $TAG"
